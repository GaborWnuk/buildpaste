# Builds every loader target on each push and pull request. Whenever a tag is
# pushed (e.g. `git tag v2.3.0 && git push origin v2.3.0`), the Fabric and
# NeoForge jars are attached to a GitHub release and uploaded to Modrinth
# (https://modrinth.com/mod/buildpaste-fabric-neoforge-server), which needs the
# MODRINTH_TOKEN secret set on this repository.

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  find_versions:
    runs-on: ubuntu-latest
    outputs:
      minecraftVersions: ${{ steps.find_versions.outputs.minecraftVersions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Find versions
        id: find_versions
        # Each node directory carries a committed .gitkeep: a directory holding only
        # build output does not exist in a fresh checkout, and the matrix would come
        # out empty without one.
        run: |
          minecraftVersions=$(ls -1 versions | jq -R | jq -s -c)
          echo "minecraftVersions=${minecraftVersions}" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      matrix:
        minecraftVersion: ${{ fromJson(needs.find_versions.outputs.minecraftVersions) }}
      fail-fast: false
      # Both jars are attached to the same release; serialize to avoid racing it.
      max-parallel: 1
    runs-on: ubuntu-latest
    needs: find_versions
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set Minecraft version
        run: ./gradlew "Set active project to ${{ matrix.minecraftVersion }}"

      - name: Build
        run: ./gradlew :${{ matrix.minecraftVersion }}:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildPaste-${{ matrix.minecraftVersion }}
          path: versions/${{ matrix.minecraftVersion }}/build/libs/

      # Publishing is split so that the two destinations cannot take each other down.
      # A single combined step aborts before writing anything if either platform is
      # rejected, which is how a bad Modrinth token once left a tag with no release
      # at all. GitHub goes first because it is the one that must always land.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          files: versions/${{ matrix.minecraftVersion }}/build/libs/*.jar

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: buildpaste-fabric-neoforge-server
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: versions/${{ matrix.minecraftVersion }}/build/libs/*.jar
